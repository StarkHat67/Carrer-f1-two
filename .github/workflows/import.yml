name: Import project
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          cat .import/chunk_* | base64 -d > /tmp/apex-career-v2.tar.gz
          tar -xzf /tmp/apex-career-v2.tar.gz -C .
          rm -rf .import project.tar.gz.b64 .github/workflows/import.yml
      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import APEX Career v2"
          git push
